<!DOCTYPE html> 
<html lang="id">  
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="description" content="Halaman Formulir Pemesanan Kain Sasirangan."> 
    <title>Pemesanan Kain Sasirangan</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/form.js" defer></script>
</head>
<body>
        <!-- ========== HEADER & NAVIGASI ========== --> 
<header class="header-situs"> 
  <p class="logo"><a href="index.html">Sasirangan Banua</a></p> 
  <nav aria-label="Navigasi utama"> 
    <ul class="menu"> 
      <li><a href="index.html">Beranda</a></li>

    </ul> 
  </nav>

 <main> 
   <section class="bagian" id="pesan"> 
     <h1>Formulir Pemesanan</h1> 
     <p>Isi formulir berikut. Kolom bertanda <strong>*</strong> wajib diisi.</p> 
  
     <form id="form-pesan" class="form-pesan" action="#" method="get novalidate"> 
      <div class="kolom"> 
        <label for="nama">Nama lengkap *</label> 
        <input type="text" id="nama" name="nama" required minlength="3" autocomplete="name" aria-describedby="error-nama"> 
        <p class="pesan-error" id="error-nama"></p> 
      </div>> 
  
      <div class="kolom"> 
        <label for="WA">Nomor WhatsApp *</label> 
        <input type="text" id="WA" name="WA" required minlength="3" autocomplete="name" aria-describedby="error-WA"> 
        <p class="pesan-error" id="error-WA"></p> 
      </div>> 

      <div class="kolom"> 
        <label for="email">Surel *</label> 
        <input type="text" id="email" name="email" required minlength="3" autocomplete="name" aria-describedby="error-email"> 
        <p class="pesan-error" id="error-email"></p> 
      </div> 
  
       <div class="kolom"> 
         <label for="produk">Produk yang dipesan *</label> 
         <select id="produk" name="produk" required> 
           <option value="">-- Pilih produk --</option> 
           <option>Kain Motif Gigi Haruan</option> 
           <option>Kain Motif Kambang Kacang</option> 
           <option>Selendang Iris Pudak</option> 
           <option>Kemeja Bayam Raja</option> 
           <option>Tas Naga Balimbur</option> 
           <option>Gamis Ombak Sinapur Karang</option> 
         </select> 
       </div> 
  
      <div class="kolom"> 
        <label for="jumlah">Jumlah *</label> 
        <input type="text" id="jumlah" name="jumlah" required minlength="3" autocomplete="name" aria-describedby="error-jumlah"> 
        <p class="pesan-error" id="error-jumlah"></p> 
      </div> 
  
       <fieldset> 
         <legend>Metode pengambilan *</legend> 
         <label><input type="radio" name="pengambilan" value="Ambil di galeri" checked> Ambil di galeri</label> 
         <label><input type="radio" name="pengambilan" value="Dikirim ke alamat"> Dikirim ke alamat</label> 
       </fieldset> 
  
      <div class="kolom"> 
        <label for="catatan">Catatan Tambahan *</label> 
        <input type="text" id="catatan" name="catatan" required minlength="3" autocomplete="name" aria-describedby="error-catatan"> 
        <p class="pesan-error" id="error-catatan"></p> 
      </div> 
  
      <div class="kolom"> 
        <label class="cek"> 
          <input type="checkbox" id="setuju" name="setuju" required aria-describedby="error-setuju">Saya setuju data ini hanya dipakai untuk memproses pesanan. * 
        </label> 
        <p class="pesan-error" id="error-setuju"></p> 
      </div> 
  
       <button type="submit" class="tombol">Kirim Pesanan</button>
        
     </form> 

      <!-- Muncul setelah formulir valid --> 
      <div id="hasil-pesan" class="hasil-pesan" hidden> 
        <h2>Ringkasan Pesanan</h2> 
        <pre id="ringkasan"></pre> 
        <a id="tautan-wa" class="tombol" href="#" target="_blank" rel="noopener">Lanjutkan ke WhatsApp</a> 
      </div>

   </section> 
 </main> 
</body>
